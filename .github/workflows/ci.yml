name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: metours_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      APP_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/metours_ci_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/metours_ci_test
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/metours_e2e_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-0123456
      TICKET_SIGNING_SECRET: ci-ticket-secret-ci-ticket-secret-01234567
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=ci createdb -h localhost -U ci metours_e2e_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: test-results/
          retention-days: 7
